<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Session Board. Waves stacked top to bottom, each a grid of session cards. Model colour is the main signal. Data lives in #data; never edit markup per plan. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#18202E; --muted:#5A6476; --line:#D5DBE5;
  --accent:#E2483D; --accent-ink:#FFFFFF;
  --fable:#6A3FB5; --fable-bg:#EFE8FB;
  --opus:#0B7A72; --opus-bg:#E1F3F0;
  --sonnet:#A8650B; --sonnet-bg:#FBEFD9;
  --done:#2E7D4F; --run:#1F5FBF; --block:#B3261E;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#181E29; --sunk:#0C1017; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3242;
  --accent:#FF6A5C; --accent-ink:#1A0D0B;
  --fable:#B794F6; --fable-bg:#2A2140;
  --opus:#4FD1C0; --opus-bg:#12302D;
  --sonnet:#F2B34D; --sonnet-bg:#33260F;
  --done:#6BCB8F; --run:#7FB0FF; --block:#FF8A80; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#181E29; --sunk:#0C1017; --ink:#E7EBF2; --muted:#98A2B5; --line:#2A3242;
  --accent:#FF6A5C; --accent-ink:#1A0D0B;
  --fable:#B794F6; --fable-bg:#2A2140;
  --opus:#4FD1C0; --opus-bg:#12302D;
  --sonnet:#F2B34D; --sonnet-bg:#33260F;
  --done:#6BCB8F; --run:#7FB0FF; --block:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--sunk);border-radius:4px;padding:0 4px}
header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:-.02em;line-height:1.04;margin-top:6px}
h1 .dot{color:var(--accent)}
.lede{color:var(--muted);max-width:66ch;margin:10px 0 0}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:200px}
.progress b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
.progress button{margin-top:10px;background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}

.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lg{border-radius:12px;padding:12px 14px;background:var(--m-bg)}
.lg .name{font-family:var(--display);font-weight:700;font-size:17px;color:var(--m)}
.lg p{margin:4px 0 0;font-size:13px}
.lg .cost{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}

.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono);font-size:13px}
.flow .step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.flow .step.solo{border-color:var(--ink)}
.flow .arrow{color:var(--muted)}
.flow small{color:var(--muted);font-size:11px;display:block}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;font-size:14px}
.note b{font-family:var(--display)}
.note ul{margin:6px 0 0;padding-left:18px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters span{font-size:13px;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section.wave{display:flex;flex-direction:column;gap:14px}
.wave-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.wave-head h2{font-size:24px;font-weight:700}
.wave-head .par{font-family:var(--mono);font-size:12px;color:var(--muted)}
.wave-head p{margin:0;color:var(--muted);font-size:14px;flex:1 1 320px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--m);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.is-ready{box-shadow:0 0 0 2px var(--m)}
.card.is-done,.card.is-skip{opacity:.55}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.id{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.02em}
.model{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--m);background:var(--m-bg);border-radius:6px;padding:3px 8px}
.meta{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid currentColor;color:var(--muted)}
.status.s-ready{color:var(--accent)}
.status.s-running{color:var(--run)}
.status.s-done{color:var(--done)}
.status.s-blocked{color:var(--block)}
.card h3{font-size:18px;font-weight:700;line-height:1.25}
.why{margin:-4px 0 0;font-size:13.5px;color:var(--muted)}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13.5px}
dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px;white-space:nowrap}
dd{margin:0;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:11.5px;background:var(--sunk);border-radius:5px;padding:1px 6px}
.none{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.copied{background:var(--done);border-color:var(--done);color:var(--surface)}
.done-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto;cursor:pointer}
.done-toggle input{width:16px;height:16px;accent-color:var(--done)}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;color:var(--muted)}
pre{margin:8px 0 0;background:var(--sunk);border-radius:8px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
footer{color:var(--muted);font-size:13px}
.hidden-by-filter{display:none}
@media (max-width:820px){ header.top{grid-template-columns:1fr} .legend{grid-template-columns:1fr} }
@media (max-width:420px){ .grid{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1><span id="title"></span><span class="dot">.</span></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="progress" aria-live="polite">
      <div class="eyebrow">Sessions done</div>
      <b id="doneCount">0</b> <span class="none">of <span id="totalCount">0</span></span>
      <div class="bar"><i id="doneBar"></i></div>
      <button type="button" id="resetDone">Clear my checkmarks</button>
    </div>
  </header>
  <div class="legend" id="legend"></div>
  <div class="flow" id="flow" aria-label="Order of waves"></div>
  <div class="notes" id="notes"></div>
  <div class="filters" role="group" aria-label="Filter sessions" id="filters"><span>Show</span></div>
  <div id="waves" style="display:flex;flex-direction:column;gap:40px"></div>
  <footer id="foot"></footer>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  // Model roster: bump versions here only.
  var MODELS = {
    Fable:  {k:"fable",  name:"Fable 5.1",  use:"Planning, architecture, research and the hardest logic, where a wrong call is expensive.", cost:"Most capable · highest cost"},
    Opus:   {k:"opus",   name:"Opus 5.5",   use:"Building complex features across many files: money, auth, state, integrations, merges.", cost:"Default builder"},
    Sonnet: {k:"sonnet", name:"Sonnet 5.5", use:"Clearly specified work: UI, content, tests, docs, mechanical changes against a settled plan.", cost:"Fastest · lowest cost"}
  };
  var S = D.sessions, byId = {};
  S.forEach(function(s){ byId[s.id] = s; });
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) for (var a in attrs){ if (a==='text') n.textContent = attrs[a]; else n.setAttribute(a, attrs[a]); }
    (kids||[]).forEach(function(k){ if (k) n.appendChild(typeof k==='string' ? document.createTextNode(k) : k); });
    return n;
  }
  function mv(m){ var k = MODELS[m].k; return '--m:var(--'+k+');--m-bg:var(--'+k+'-bg)'; }
  function tagList(list, empty){ return list.length ? el('div',{'class':'tags'}, list.map(function(x){ return el('span',{'class':'tag',text:x}); })) : el('span',{'class':'none',text:empty}); }

  document.title = D.title;
  document.getElementById('title').textContent = D.title;
  document.getElementById('eyebrow').textContent = D.eyebrow || '';
  var waveNums = []; S.forEach(function(s){ if (waveNums.indexOf(s.wave) < 0) waveNums.push(s.wave); }); waveNums.sort(function(a,b){return a-b;});
  document.getElementById('lede').textContent = (D.summary ? D.summary + ' ' : '') + S.length + ' sessions in ' + waveNums.length + ' waves. Copy a prompt, open a new Claude Code session with the model shown, paste it in.';
  document.getElementById('foot').textContent = (D.updated ? 'Updated ' + D.updated + '. ' : '') + 'Status comes from the plan; your own Done checkmarks are saved in this browser only.';

  Object.keys(MODELS).forEach(function(m){
    var c = S.filter(function(s){ return s.model===m; }).length;
    if (!c) return;
    document.getElementById('legend').appendChild(el('div',{'class':'lg',style:mv(m)},[
      el('div',{'class':'name',text:MODELS[m].name}), el('p',{text:MODELS[m].use}), el('div',{'class':'cost',text:c+(c===1?' session · ':' sessions · ')+MODELS[m].cost})
    ]));
  });

  var waveMeta = {}; (D.waves||[]).forEach(function(w){ waveMeta[w.n] = w; });
  var flow = document.getElementById('flow');
  waveNums.forEach(function(n, i){
    var ids = S.filter(function(s){ return s.wave===n; }).map(function(s){ return s.id; });
    if (i) flow.appendChild(el('span',{'class':'arrow',text:'→'}));
    flow.appendChild(el('div',{'class':'step'+(ids.length===1?' solo':'')},[ ids.join(' · '), el('small',{text: ids.length===1 ? 'alone' : 'in parallel'}) ]));
  });

  (D.notes||[]).forEach(function(nt){
    document.getElementById('notes').appendChild(el('div',{'class':'note'},[ el('b',{text:nt.title}), el('ul',{}, nt.items.map(function(x){ return el('li',{text:x}); })) ]));
  });

  var KEY = 'session-board:' + (D.slug || D.title), mine = {};
  try { mine = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ mine = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch(e){} }
  function isDone(s){ return s.status==='done' || s.status==='skip' || !!mine[s.id]; }
  function isReady(s){ return !isDone(s) && s.status!=='running' && s.status!=='blocked' && (s.needs||[]).every(function(id){ return byId[id] && isDone(byId[id]); }); }

  function copy(text, btn, pre, det){
    function ok(){ btn.textContent='Copied'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent='Copy prompt'; btn.classList.remove('copied'); },1800); }
    function fallback(){ det.open = true; var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent='Selected, press Ctrl/Cmd+C'; setTimeout(function(){ btn.textContent='Copy prompt'; },2500); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); } catch(e){ fallback(); }
  }

  var cards = [], wavesEl = document.getElementById('waves');
  waveNums.forEach(function(n){
    var inWave = S.filter(function(s){ return s.wave===n; });
    var w = waveMeta[n] || {};
    var sec = el('section',{'class':'wave'},[ el('div',{'class':'wave-head'},[
      el('h2',{text:'Wave ' + n + (w.title ? ' · ' + w.title : '')}),
      el('span',{'class':'par',text: inWave.length===1 ? 'run alone' : inWave.length + ' sessions, run together'}),
      w.desc ? el('p',{text:w.desc}) : null
    ])]);
    var grid = el('div',{'class':'grid'});
    inWave.forEach(function(s){
      var needs = s.needs || [];
      var along = inWave.filter(function(o){ return o.id!==s.id; }).map(function(o){ return o.id; });
      var start = s.start || (needs.length ? 'After ' + needs.join(', ') + (needs.length>1 ? ' are' : ' is') + ' done' : 'Now');
      var pre = el('pre',{text:s.prompt});
      var det = el('details',{},[ el('summary',{text:'Read the prompt'}), pre ]);
      var btn = el('button',{'class':'btn',type:'button',text:'Copy prompt'});
      btn.addEventListener('click', function(){ copy(s.prompt, btn, pre, det); });
      var cb = el('input',{type:'checkbox'}); cb.checked = isDone(s);
      if (s.status==='done' || s.status==='skip') cb.disabled = true;
      var badge = el('span',{'class':'status'});
      var metaBits = [s.effort ? 'effort ' + s.effort : '', s.worktree ? 'worktree on' : 'worktree off'].filter(Boolean).join(' · ');
      var card = el('article',{'class':'card',style:mv(s.model)},[
        el('div',{'class':'card-top'},[ el('span',{'class':'id',text:s.id}), el('span',{'class':'model',text:MODELS[s.model].name}), el('span',{'class':'meta',text:metaBits}), badge ]),
        el('h3',{text:s.title}),
        s.why ? el('p',{'class':'why',text:s.why}) : null,
        el('dl',{},[
          el('dt',{text:'Start'}), el('dd',{text:start}),
          el('dt',{text:'Needs'}), el('dd',{},[ tagList(needs,'Nothing') ]),
          el('dt',{text:'Alongside'}), el('dd',{},[ tagList(along,'Nothing, run it alone') ])
        ]),
        el('div',{'class':'actions'},[ btn, el('label',{'class':'done-toggle'},[cb,'Done']) ]),
        det
      ]);
      cb.addEventListener('change', function(){ if (cb.checked) mine[s.id]=1; else delete mine[s.id]; save(); refresh(); });
      cards.push({card:card, s:s, cb:cb, badge:badge});
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    wavesEl.appendChild(sec);
  });

  var filter = 'all', filters = document.getElementById('filters');
  [['all','All'],['ready','Ready now'],['todo','Not done']].concat(Object.keys(MODELS).filter(function(m){ return S.some(function(s){ return s.model===m; }); }).map(function(m){ return [m, MODELS[m].name]; }))
  .forEach(function(f){
    var b = el('button',{'class':'chip',type:'button','aria-pressed': f[0]==='all' ? 'true' : 'false',text:f[1]});
    b.addEventListener('click', function(){ filter = f[0]; filters.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', c===b ? 'true' : 'false'); }); refresh(); });
    filters.appendChild(b);
  });

  function refresh(){
    var n = 0;
    cards.forEach(function(c){
      var d = isDone(c.s), r = isReady(c.s); if (d) n++;
      var st = c.s.status==='skip' ? 'skip' : d ? 'done' : c.s.status==='running' ? 'running' : c.s.status==='blocked' ? 'blocked' : r ? 'ready' : 'waiting';
      c.badge.textContent = st.toUpperCase(); c.badge.className = 'status s-' + st;
      c.card.classList.toggle('is-done', d && st!=='skip'); c.card.classList.toggle('is-skip', st==='skip'); c.card.classList.toggle('is-ready', r);
      var show = filter==='all' || (filter==='ready' ? r : filter==='todo' ? !d : c.s.model===filter);
      c.card.classList.toggle('hidden-by-filter', !show);
    });
    document.querySelectorAll('section.wave').forEach(function(sec){ sec.hidden = !sec.querySelector('.card:not(.hidden-by-filter)'); });
    document.getElementById('doneCount').textContent = n;
    document.getElementById('totalCount').textContent = cards.length;
    document.getElementById('doneBar').style.width = (cards.length ? 100*n/cards.length : 0) + '%';
  }
  document.getElementById('resetDone').addEventListener('click', function(){ mine = {}; save(); cards.forEach(function(c){ c.cb.checked = isDone(c.s); }); refresh(); });
  refresh();
})();
</script>
